# Build the iOS app on GitHub's macOS runner.
#
# Two modes — decided per-run by whether the signing secrets exist:
#
#  1. UNSIGNED COMPILE CHECK  (always runs, no secrets required)
#       Verifies the code actually compiles on macOS + Xcode. Produces
#       a build log — no installable .ipa. Useful as a smoke test while
#       you set up signing.
#
#  2. SIGNED IPA + TESTFLIGHT UPLOAD  (only when secrets are set)
#       Archives, signs, exports an .ipa, uploads it as a workflow
#       artifact you can download, and (optionally) pushes to TestFlight.
#       See docs/IOS_BUILD_SIGNING.md for the exact GitHub Secrets to add.
#
# Manual trigger + on every push to main.

name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        # Capacitor CLI requires Node >= 22.0.0 (and GitHub is deprecating
        # Node 20 on Actions runners anyway).
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS dependencies
        # --legacy-peer-deps: react-leaflet@4 declares react@^18 as a peer
        # but the project uses react@19; the app actually works fine.
        run: npm ci --legacy-peer-deps

      - name: Build web bundle for Capacitor
        run: npx vite build --config vite.cap.config.ts

      # Split cap sync into 3 explicit steps so each surfaces its own log:
      # 1) update — scaffolds ios/capacitor-cordova-ios-plugins and
      #    regenerates capacitor.config.json / config.xml. MUST run first.
      # 2) copy — copies the web bundle (dist-cap) into ios/App/App/public.
      # 3) pod install — resolves native pods.
      - name: Update iOS native project (plugin bridge, config)
        run: npx cap update ios

      - name: Copy web bundle into ios/App/App/public
        run: npx cap copy ios

      - name: Force capacitor-swift-pm pin to 7.6.8 (matches plugin API surface)
        # cap update regenerates Package.swift and clobbers our pin. Force
        # it back to 7.6.8 (matches @capacitor/ios in package.json) so all
        # three plugins (geolocation, status-bar, push-notifications)
        # compile against the runtime they were built for.
        run: |
          set -euo pipefail
          F=ios/App/CapApp-SPM/Package.swift
          sed -i '' 's|exact: "[0-9.]*"|exact: "7.6.8"|' "$F"
          sed -i '' 's|from: "[0-9.]*"|exact: "7.6.8"|'  "$F"
          echo "=== pinned Package.swift ==="
          cat "$F"

      # This project uses Swift Package Manager (ios/App/CapApp-SPM), not
      # CocoaPods — xcodebuild resolves the SPM graph automatically. No
      # `pod install` step needed.

      # ---------- Path 1: UNSIGNED compile check ----------
      # Runs when signing secrets are NOT set. Just proves the app builds.
      - name: Compile check (iOS Simulator, unsigned)
        if: ${{ env.HAS_SIGNING != 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && 'true' || 'false' }}
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      # ---------- Path 2: SIGNED archive + IPA export ----------
      # Runs only when all signing secrets are present.

      - name: Import signing certificate
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && 'true' || 'false' }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          # Decode with printf (no trailing newline, no echo quirks)
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output "$CERT_PATH"
          echo "cert file size: $(wc -c < "$CERT_PATH") bytes"

          # Prove the .p12 password is right before touching the keychain
          openssl pkcs12 -info -in "$CERT_PATH" -passin "pass:$P12_PASSWORD" -nokeys 2>&1 | head -5

          # Fresh keychain in RUNNER_TEMP (auto-cleaned)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Confirm the identity is visible to codesign
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && 'true' || 'false' }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/build.mobileprovision"

      - name: Archive + export IPA
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && 'true' || 'false' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: ios/App
        run: |
          set -euo pipefail

          # Discover the profile UUID + name we just installed. The workflow
          # doesn't hard-code these because the profile can be regenerated
          # on Apple's portal without touching this file.
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/build.mobileprovision"
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)
          echo "Provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"

          # Substitute the Team ID into ExportOptions.plist and inject the
          # bundle-id → profile mapping so exportArchive knows which profile
          # to embed in the .ipa.
          sed -i '' "s/__TEAM_ID__/$APPLE_TEAM_ID/g" ExportOptions/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" ExportOptions/ExportOptions.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:org.zehlzeh.volunteer string $PROFILE_UUID" ExportOptions/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :signingStyle manual" ExportOptions/ExportOptions.plist

          # Archive with MANUAL signing so the runner never needs to talk to
          # Apple's servers — cert is in the keychain, profile UUID is
          # passed explicitly.
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA as workflow artifact
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && 'true' || 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: zlz-rescue-ios
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      # ---------- Optional: TestFlight upload ----------
      # Runs only if you've also provided an App Store Connect API key.

      - name: Upload to TestFlight
        if: ${{ env.HAS_TESTFLIGHT == 'true' }}
        env:
          HAS_TESTFLIGHT: ${{ secrets.APPSTORE_API_KEY_BASE64 != '' && 'true' || 'false' }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa -t ios \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER_ID"
