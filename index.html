<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Oct 14 client: viewport-fit=cover so iPhones with a notch / home bar report
         env(safe-area-inset-*); the app shell pads by those insets (src/index.css) so
         nothing hides under the notch. Android reports 0 there (the WebView already
         sits between the status bar and the nav buttons), so nothing changes on Android. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2C5A3B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zeh L'Zeh" />
    <title>Zeh L'Zeh Rescue</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
